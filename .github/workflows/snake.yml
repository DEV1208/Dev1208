name: Generate premium snake animation

on:
  schedule:
    # Executes exactly once every 12 hours (fixed cron syntax)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        # Switched to the full snk@v3 for better environment handling
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Generates both a transparent standard and transparent dark-mode version
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=414EFF8&color_bg=transparent&color_dots=#0f172a,#0284c7,#0ea5e9,#38bdf8,#7dd3fc
            dist/github-contribution-grid-snake-dark.svg?color_snake=414EFF8&color_bg=transparent&color_dots=#0f172a,#0284c7,#0ea5e9,#38bdf8,#7dd3fc

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
