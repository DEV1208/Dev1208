name: Generate Contribution Snake

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate the snake files in the dist folder
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # This line forces the custom Dev Blue and Cyan theme
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=38bdf8&color_dots=#0f172a,#0284c7,#0ea5e9,#38bdf8,#7dd3fc

      - name: Push the new snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
